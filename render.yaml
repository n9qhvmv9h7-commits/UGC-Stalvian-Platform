# Render Blueprint — Stalvian UGC Creator Platform
#
# Three services + one database. The creator app and the admin panel are two
# separate web services built from the SAME frontend/Dockerfile, told apart by
# NEXT_PUBLIC_APP_MODE — so the admin panel is never served from the public
# creator URL. See README "Production deploy" for the two-pass URL wiring.
#
# The platform consumes the Stalvian Marketing Panel API — set PANEL_* to the
# deployed panel (e.g. https://marketing-panel-api.onrender.com).

databases:
  - name: ugc-platform-db
    plan: basic-256mb
    region: frankfurt
    databaseName: ugc_platform
    user: app

services:
  # --- Backend API (FastAPI + APScheduler; no worker service needed) ---
  - type: web
    name: ugc-platform-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ugc-platform-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: PANEL_API_URL
        # The deployed Marketing Panel. Note the host does not match its
        # service name ("marketing-panel-api") — Render keeps the hostname a
        # service was first created with.
        value: https://insider-trading-api-rqwi.onrender.com
      - key: PANEL_API_KEY
        sync: false # scoped key for the panel's /api/ugc/* surface
      - key: PANEL_WEBHOOK_SECRET
        sync: false # shared HMAC secret; unset -> /api/webhooks/panel returns 503
      - key: ANTHROPIC_API_KEY
        sync: false # content localization (Claude Haiku)
      - key: YOUTUBE_API_KEY
        sync: false # optional: auto view-tracking for YouTube links
      # Client referrals (see REFERRAL_API_REQUIREMENTS.md). The key is what the
      # Stalvian product sends as X-API-Key when it validates a code, attributes
      # a client or reports a fee; unset -> those endpoints return 503 and the
      # admin panel records everything by hand.
      - key: REFERRAL_API_KEY
        sync: false
      - key: REFERRAL_COMMISSION_BPS
        value: "2500" # creators' share of referred-client fees, in basis points (25%)
      - key: REFERRAL_SIGNUP_URL
        sync: false # optional: where clients sign up, linked next to the code
      # Both frontend origins — CORS rejects anything not listed here. These
      # stay blank until the first deploy assigns hostnames; Render does not
      # guarantee <service-name>.onrender.com, so they cannot be predicted.
      - key: FRONTEND_URL
        sync: false # the creator app's URL, e.g. https://ugc-creators-web.onrender.com
      - key: ADMIN_URL
        sync: false # the admin panel's URL, e.g. https://ugc-admin-web.onrender.com
      # First admin. A fresh database has no accounts and there is no signup,
      # so without these nobody can log in. Applied once, on startup, only while
      # the database holds no admin. Clear them after the first successful login.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Stalvian Admin

  # --- Creator app (public) ---
  - type: web
    name: ugc-creators-web
    runtime: docker
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    healthCheckPath: /
    envVars:
      # Render passes these to the Docker build as build args, which is what
      # NEXT_PUBLIC_* needs — they are inlined into the bundle at build time.
      # Changing one requires a redeploy, not just a restart.
      - key: NEXT_PUBLIC_API_URL
        sync: false # e.g. https://ugc-platform-api.onrender.com
      - key: NEXT_PUBLIC_APP_MODE
        value: creator # serves the creator app; /admin/* redirects to /dashboard

  # --- Admin panel (internal) ---
  - type: web
    name: ugc-admin-web
    runtime: docker
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    healthCheckPath: / # redirects to /admin; Render counts 3xx as healthy
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # same API as the creator app
      - key: NEXT_PUBLIC_APP_MODE
        value: admin # serves /admin/* + /login only; everything else -> /admin
      - key: NEXT_PUBLIC_CREATOR_URL
        sync: false # creator app URL, for the "Creator App" link in the admin sidebar
