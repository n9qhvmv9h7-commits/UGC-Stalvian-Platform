services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ugc_platform
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - ugc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ugc_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8100:8100"
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/ugc_platform
      # A panel running on the host machine is not "localhost" inside the container
      - PANEL_API_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8100
    ports:
      - "3100:3100"
    depends_on:
      - backend

volumes:
  ugc_pgdata:
